<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      try {
        const theme = localStorage.getItem('cifrawealth:theme') === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch { /* Dark theme is the default when storage is unavailable. */ }
    </script>
    <title>Cifra Wealth</title>
    <meta name="description" content="Aplicativo de gestão financeira pessoal e controle patrimonial com painel de receitas, despesas, categorias, metas e relatórios detalhados." />
    <meta property="og:title" content="Cifra Wealth" />
    <meta property="og:description" content="Aplicativo de gestão financeira pessoal e controle patrimonial com painel de receitas, despesas, categorias, metas e relatórios detalhados." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
